<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЗ — сложение/вычитание + графики (№3 ЕГЭ)</title>
<style>
  :root{
    --beige:#F5EEDF;
    --gray:#ECECEC;
    --gray-txt:#6b6b6b;
    --green:#4CAF50;
    --green-bg:#E9F5EA;
    --red:#D64545;
    --red-bg:#FBEAEA;
    --blue:#2E5E8C;
    --ink:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray);
    color: var(--ink);
    padding: 24px 12px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  .nick{text-align:right;color:var(--gray-txt);font-weight:600;font-size:14px;margin-bottom:8px;}
  header{text-align:center;margin-bottom:14px;}
  header h1{color:var(--blue);font-size:26px;margin:0 0 4px;}
  header p{margin:0;color:#555;font-style:italic;font-size:15px;}

  .progress-card{
    background:white;border-radius:14px;padding:14px 18px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-bottom:22px;border:1px solid #ddd;position:sticky;top:10px;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .progress-stats{font-size:15px;}
  .progress-stats b{color:var(--blue);}
  .bar-outer{flex:1;height:10px;background:var(--gray);border-radius:6px;overflow:hidden;margin:0 14px;}
  .bar-inner{height:100%;background:var(--green);width:0%;transition:width .3s ease;}

  .part-title{
    text-align:center;color:var(--blue);font-size:20px;font-weight:700;
    margin:34px 0 6px;
  }

  .group-title{
    background:var(--gray);border-left:6px solid var(--blue);color:var(--blue);
    font-weight:700;font-size:18px;padding:10px 14px;border-radius:4px;margin:26px 0 10px;
  }
  .group-note{
    font-size:13px;color:var(--gray-txt);font-style:italic;margin:-2px 0 12px 4px;
  }

  table.data{border-collapse:collapse;width:100%;margin:8px 0 16px;font-size:14px;}
  table.data th, table.data td{border:1px solid #ccc;padding:6px 8px;text-align:center;}
  table.data th{background:var(--beige);}

  .q{
    background:white;border:1px solid #ddd;border-radius:12px;padding:14px 16px;
    margin-bottom:12px;transition: background .2s, border-color .2s;
  }
  .q.correct{background:var(--green-bg); border-color:var(--green);}
  .q-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .q-num{font-weight:700;color:var(--blue);}
  .q-text{font-size:15px;line-height:1.4;flex:1;min-width:220px;}
  .q-controls{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .q input{
    width:130px;padding:7px 8px;font-size:16px;border:1px solid #bbb;border-radius:8px;text-align:center;
  }
  .q input:focus{outline:2px solid var(--blue); border-color:var(--blue);}
  .q button.check{
    background:var(--blue);color:white;border:none;padding:8px 14px;border-radius:8px;font-size:14px;cursor:pointer;
  }
  .q button.check:hover{background:#244a70;}
  .feedback{font-size:14px;font-weight:600;}
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .feedback.hint{color:var(--gray-txt); font-weight:400; font-style:italic;}

  .footer-note{text-align:center;color:var(--gray-txt);font-size:13px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="nick">@lerapodmareva</div>
  <header>
    <h1>Домашнее задание</h1>
    <p>Сложение/вычитание + №3 ЕГЭ ФИПИ (графики и диаграммы)</p>
  </header>

  <div class="progress-card">
    <div class="progress-stats">Решено: <b id="doneCount">0</b> / <span id="totalCount">0</span></div>
    <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
  </div>

  <div id="content"></div>

  <div class="footer-note">Ответ не показывается никогда — если не получается, спроси у преподавателя на занятии.</div>
</div>

<script>
const ARITHMETIC_GROUPS = [
  { title: "Одинаковые знаки", items: [
      ["1", "+11 + 9", 20], ["2", "–11 – 9", -20], ["3", "+23 + 17", 40],
      ["4", "–23 – 17", -40], ["5", "+6 + 42", 48], ["6", "–33 – 19", -52],
  ]},
  { title: "Разные знаки", items: [
      ["7", "+15 – 6", 9], ["8", "–15 + 6", -9], ["9", "+9 – 24", -15],
      ["10", "–9 + 24", 15], ["11", "+28 – 41", -13], ["12", "–52 + 19", -33],
  ]},
  { title: "Одинаковые и разные знаки", items: [
      ["13", "–21 + 8", -13], ["14", "–21 – 8", -29], ["15", "34 – 50", -16],
      ["16", "–34 – 50", -84], ["17", "19 + 19", 38], ["18", "–19 + 19", 0],
      ["19", "–80 + 27", -53], ["20", "–80 – 27", -107], ["21", "63 – 90", -27],
      ["22", "–63 + 90", 27],
  ]},
  { title: "Смешанные примеры — вспоминаем умножение и деление", items: [
      ["23", "(–3) × (–8) + 7", 31], ["24", "(–3) + (–8) × 7", -59],
      ["25", "24 : (–6) – 9", -13], ["26", "24 – (–6) × 9", 78],
      ["27", "–4 × 11 + 50", 6], ["28", "–4 + 11 × 50", 546],
  ]},
];

const GRAPH_NOTE = "График у тебя на доске.";

const CHART_GROUPS = [
  { title: "№24 — разогрев двигателя", note: GRAPH_NOTE, items: [
      ["24.1", "Определите по графику, сколько минут прошло с момента запуска двигателя до включения вентилятора.", 8],
      ["24.2", "Определите по графику, через какое наименьшее количество минут после запуска двигателя температура двигателя будет равна 30 °C.", 2],
      ["24.3", "Определите по графику, на сколько градусов нагреется двигатель с пятой по восьмую минуту разогрева.", 30],
  ]},
  { title: "№32 — крутящий момент", note: GRAPH_NOTE, items: [
      ["32.1", "Определите по графику, какого наименьшего числа оборотов двигателя в минуту достаточно, чтобы автомобиль начал движение.", 1000],
      ["32.2", "Определите по графику, какое наименьшее число оборотов в минуту должен поддерживать водитель, чтобы крутящий момент был не меньше 60 Н·м.", 1500],
      ["32.3", "Определите по графику, какое наименьшее число оборотов в минуту должен поддерживать водитель, чтобы крутящий момент был не меньше 140 Н·м.", 2500],
  ]},
  { title: "№35 — температура в Петрозаводске", note: GRAPH_NOTE, items: [
      ["35.1", "Определите по диаграмме наименьшую среднемесячную температуру в Петрозаводске в 1976 году. Ответ дайте в градусах Цельсия.", -15],
      ["35.2", "Определите по диаграмме наименьшую среднемесячную температуру в Петрозаводске во второй половине 1976 года. Ответ дайте в градусах Цельсия.", -5],
      ["35.3", "Определите по диаграмме наибольшую среднемесячную температуру в Петрозаводске в первой половине 1976 года. Ответ дайте в градусах Цельсия.", 10],
  ]},
];

const HAMMER_TABLE = `
<table class="data">
<tr><th>Спортсмен</th><th>I</th><th>II</th><th>III</th><th>IV</th><th>V</th><th>VI</th></tr>
<tr><td>Витков</td><td>55,5</td><td>54,5</td><td>55</td><td>53,5</td><td>54</td><td>52</td></tr>
<tr><td>Птицын</td><td>52,5</td><td>53</td><td>51,5</td><td>56</td><td>55,5</td><td>55</td></tr>
<tr><td>Коваленко</td><td>53,5</td><td>54</td><td>54,5</td><td>54</td><td>54,5</td><td>52</td></tr>
<tr><td>Арнюк</td><td>52,5</td><td>52</td><td>52,5</td><td>51,5</td><td>53</td><td>52</td></tr>
</table>`;

const TAX_TABLE = `
<table class="data">
<tr><th>Мощность (л.с.)</th><th>Ставка (руб. за 1 л.с. в год)</th></tr>
<tr><td>не более 70</td><td>0</td></tr>
<tr><td>71–100</td><td>12</td></tr>
<tr><td>101–125</td><td>25</td></tr>
<tr><td>126–150</td><td>35</td></tr>
<tr><td>151–175</td><td>45</td></tr>
<tr><td>176–200</td><td>50</td></tr>
<tr><td>201–225</td><td>65</td></tr>
<tr><td>226–250</td><td>75</td></tr>
<tr><td>свыше 250</td><td>150</td></tr>
</table>`;

const TABLE_GROUPS = [
  { title: "№44 — метание молота",
    note: "Места распределяются по результату ЛУЧШЕЙ попытки каждого спортсмена: чем дальше метнул, тем лучше.",
    table: HAMMER_TABLE,
    items: [["44", "Каков результат лучшей попытки (в метрах) спортсмена, занявшего второе место?", 55.5]],
  },
  { title: "№51 — налоговая ставка", note: "", table: TAX_TABLE,
    items: [["51.1", "Какова налоговая ставка на автомобиль мощностью 280 л.с.?", 150]],
  },
];

const content = document.getElementById('content');
let total = 0;
let solvedCount = 0;
const attempts = {};

function safeId(id) { return id.replace(/\./g, '_'); }
function normalize(str) { return str.trim().replace(/–|—/g, '-').replace(',', '.'); }

function renderQuestion(id, text, answer) {
  const sid = safeId(id);
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.id = 'q-' + sid;
  qDiv.innerHTML = `
    <div class="q-head">
      <div class="q-num">${id})</div>
      <div class="q-text">${text}</div>
    </div>
    <div class="q-controls">
      <input type="text" inputmode="numeric" placeholder="ответ" id="input-${sid}">
      <button class="check" data-id="${id}" data-answer="${answer}">Проверить</button>
      <span class="feedback" id="fb-${sid}"></span>
    </div>
  `;
  content.appendChild(qDiv);
  attempts[id] = 0;
  total++;
}

function renderGroup(group, withTable) {
  const h = document.createElement('div');
  h.className = 'group-title';
  h.textContent = group.title;
  content.appendChild(h);
  if (group.note) {
    const note = document.createElement('div');
    note.className = 'group-note';
    note.textContent = group.note;
    content.appendChild(note);
  }
  if (withTable && group.table) {
    const tableWrap = document.createElement('div');
    tableWrap.innerHTML = group.table;
    content.appendChild(tableWrap);
  }
  group.items.forEach(([id, text, answer]) => renderQuestion(id, text, answer));
}

const part1 = document.createElement('div');
part1.className = 'part-title';
part1.textContent = 'Часть 1. Сложение и вычитание рациональных чисел';
content.appendChild(part1);
ARITHMETIC_GROUPS.forEach(g => renderGroup(g, false));

const part2 = document.createElement('div');
part2.className = 'part-title';
part2.textContent = 'Часть 2. №3 ЕГЭ ФИПИ — графики и диаграммы';
content.appendChild(part2);
CHART_GROUPS.forEach(g => renderGroup(g, false));
TABLE_GROUPS.forEach(g => renderGroup(g, true));

document.getElementById('totalCount').textContent = total;

content.addEventListener('click', (e) => {
  if (!e.target.matches('button.check')) return;
  const id = e.target.getAttribute('data-id');
  const answer = parseFloat(e.target.getAttribute('data-answer'));
  checkAnswer(id, answer);
});

content.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const sid = e.target.id.replace('input-', '');
    const btn = document.querySelector(`#q-${sid} button.check`);
    if (btn) btn.click();
  }
});

function checkAnswer(id, answer) {
  const sid = safeId(id);
  const inputEl = document.getElementById('input-' + sid);
  const fb = document.getElementById('fb-' + sid);
  const qDiv = document.getElementById('q-' + sid);
  const raw = normalize(inputEl.value);
  const val = parseFloat(raw);

  if (raw === '' || isNaN(val)) {
    fb.className = 'feedback hint';
    fb.textContent = 'введи число';
    return;
  }

  attempts[id]++;

  if (val === answer) {
    qDiv.className = 'q correct';
    fb.className = 'feedback ok';
    const n = attempts[id];
    const word = n === 1 ? 'верно с 1 раза' : (n === 2 ? 'верно со 2 раза' : `верно с ${n} раза`);
    fb.textContent = '✓ ' + word;
    inputEl.disabled = true;
    qDiv.querySelector('button.check').disabled = true;
    solvedCount++;
    updateProgress();
  } else {
    fb.className = 'feedback bad';
    fb.textContent = `✗ пока не то (попытка ${attempts[id]})`;
  }
}

function updateProgress() {
  document.getElementById('doneCount').textContent = solvedCount;
  document.getElementById('bar').style.width = (solvedCount / total * 100) + '%';
}
</script>
</body>
</html>
