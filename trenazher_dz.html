<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ДЗ — Задание 1, №14, ЕГЭ №5</title>
<style>
  :root{
    --beige:#F5EEDF; --gray:#ECECEC; --gray-txt:#6b6b6b;
    --green:#4CAF50; --green-bg:#E9F5EA; --red:#D64545; --red-bg:#FBEAEA;
    --blue:#2E5E8C; --ink:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--gray);color:var(--ink);padding:24px 12px 60px;}
  .wrap{max-width:740px;margin:0 auto;}
  .nick{text-align:right;color:var(--gray-txt);font-weight:600;font-size:14px;margin-bottom:8px;}
  header{text-align:center;margin-bottom:14px;}
  header h1{color:var(--blue);font-size:26px;margin:0 0 4px;}
  header p{margin:0;color:#555;font-style:italic;font-size:15px;}

  .progress-card{
    background:white;border-radius:14px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
    gap:12px;margin-bottom:22px;border:1px solid #ddd;position:sticky;top:10px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .progress-stats{font-size:15px;} .progress-stats b{color:var(--blue);}
  .bar-outer{flex:1;height:10px;background:var(--gray);border-radius:6px;overflow:hidden;margin:0 14px;}
  .bar-inner{height:100%;background:var(--green);width:0%;transition:width .3s ease;}

  .group-title{background:var(--gray);border-left:6px solid var(--blue);color:var(--blue);font-weight:700;font-size:18px;padding:10px 14px;border-radius:4px;margin:26px 0 10px;}

  .q{background:white;border:1px solid #ddd;border-radius:12px;padding:14px 16px;margin-bottom:12px;transition:background .2s,border-color .2s;}
  .q.correct{background:var(--green-bg);border-color:var(--green);}
  .q.wrong-attempt{background:var(--red-bg);border-color:var(--red);}
  .q-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .q-num{font-weight:700;color:var(--blue);}
  .q-text{font-size:17px;flex:1;min-width:160px;line-height:1.4;}
  .q-controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}

  .ifrac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-size:0.82em;line-height:1.15;position:relative;top:2px;}
  .ifrac .num,.ifrac .den{padding:0 4px;} .ifrac .num{border-bottom:2px solid currentColor;}

  .sign-toggle{width:38px;height:38px;border-radius:8px;border:1px solid #bbb;background:#f5f5f5;font-size:20px;font-weight:700;cursor:pointer;color:var(--red);flex-shrink:0;}
  .sign-toggle.plus{color:var(--green);}
  .comma-btn{width:38px;height:38px;border-radius:8px;border:1px solid #bbb;background:#f5f5f5;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;}
  .plain-input{width:130px;padding:7px 8px;font-size:16px;border:1px solid #bbb;border-radius:8px;text-align:center;}
  input:focus{outline:2px solid var(--blue);border-color:var(--blue);}

  button.check{background:var(--blue);color:white;border:none;padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;}
  button.check:hover{background:#244a70;}
  .feedback{font-size:14px;font-weight:600;}
  .feedback.ok{color:var(--green);} .feedback.bad{color:var(--red);} .feedback.hint{color:var(--gray-txt);font-weight:400;font-style:italic;}

  .footer-note{text-align:center;color:var(--gray-txt);font-size:13px;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="nick">@lerapodmareva</div>
  <header>
    <h1>Домашнее задание</h1>
    <p>Задание 1 · №14 ЕГЭ · ЕГЭ №5</p>
  </header>

  <div class="progress-card">
    <div class="progress-stats">Решено: <b id="doneCount">0</b> / <span id="totalCount">0</span></div>
    <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
  </div>

  <div id="content"></div>

  <div class="footer-note">"+/−" меняет знак, "," ставит запятую.</div>
</div>

<script>
function F(n, d) { return `<span class="ifrac"><span class="num">${n}</span><span class="den">${d}</span></span>`; }
const MINUS = '\u2212';

const TASK1 = [
  ["1", "12,45 + 7,8", 20.25],
  ["2", "15,3 " + MINUS + " 6,75", 8.55],
  ["3", "2,4 · 3,5", 8.4],
  ["4", "18,6 : 6", 3.1],
  ["5", "452,7 : 100", 4.527],
  ["6", "4,05 : 0,5", 8.1],
];

const EGE14 = [
  ["3", `${F(1,7)} · 4,2 ${MINUS} 1`, -0.4],
  ["7", `2${F(9,20)} ${MINUS} 4,8 · ${F(7,8)}`, -1.75],
  ["11", `${F(5,11)} : (${MINUS}${F(10,33)}) + 6,5`, 5],
  ["15", `(5${F(7,25)} ${MINUS} 0,6) : ${F(9,50)}`, 26],
];

const PROB = [
  ["75", "Найдите вероятность того, что случайно выбранное трёхзначное число делится на 33.", 0.03],
  ["78", "В случайном эксперименте симметричную монету бросают дважды. Найдите вероятность того, что орёл выпадет ровно два раза.", 0.25],
  ["79", "В случайном эксперименте симметричную монету бросают дважды. Найдите вероятность того, что орёл выпадет ровно один раз.", 0.5],
  ["80", "В случайном эксперименте симметричную монету бросают дважды. Найдите вероятность того, что орёл выпадет хотя бы один раз.", 0.75],
  ["81", "В случайном эксперименте симметричную монету бросают дважды. Найдите вероятность того, что во второй раз выпадет то же, что и в первый.", 0.5],
  ["82", "В случайном эксперименте симметричную монету бросают дважды. Найдите вероятность того, что орёл не выпадет ни разу.", 0.25],
  ["126", "В кафе каждому посетителю приносят бесплатно один комплимент от заведения, которого нет в меню. Вероятность того, что в качестве комплимента от заведения принесут миндальное печенье, равна 0,1. Вероятность того, что в качестве комплимента принесут эклер, равна 0,15. Найдите вероятность того, что в качестве комплимента от заведения посетителю И. принесут одно из двух: миндальное печенье или эклер.", 0.25],
  ["129", "Вероятность того, что новая шариковая ручка пишет плохо или вовсе не пишет, равна 0,11. Покупатель, не глядя, берёт одну шариковую ручку из коробки. Найдите вероятность того, что эта ручка пишет хорошо.", 0.89],
  ["135", "Вероятность того, что батарейка бракованная, равна 0,01. Покупатель в магазине выбирает случайную упаковку, в которой две таких батарейки. Найдите вероятность того, что обе батарейки окажутся неисправными.", 0.0001],
  ["142", "Помещение освещается фонарём с двумя лампами. Вероятность перегорания одной лампы в течение года равна 0,2. Найдите вероятность того, что в течение года обе лампы перегорят.", 0.04],
];

const content = document.getElementById('content');
let total = 0, solvedCount = 0;
const attempts = {}, signState = {};

function markCorrect(qDiv, fb, key) {
  qDiv.className='q correct'; fb.className='feedback ok';
  const n = attempts[key];
  fb.textContent = '✓ ' + (n===1?'верно с 1 раза':(n===2?'верно со 2 раза':`верно с ${n} раза`));
  qDiv.querySelectorAll('input,button').forEach(el=>el.disabled=true);
  solvedCount++; updateProgress();
}
function markWrong(qDiv, fb, key) {
  qDiv.className='q wrong-attempt'; fb.className='feedback bad';
  fb.textContent = `✗ пока не то (попытка ${attempts[key]})`;
}
function updateProgress(){
  document.getElementById('doneCount').textContent = solvedCount;
  document.getElementById('bar').style.width = (solvedCount/total*100)+'%';
}

function renderDecAnswer(id, textHtml, answer, prefix) {
  const key = (prefix||'') + id;
  signState[key] = 1;
  const qDiv = document.createElement('div');
  qDiv.className = 'q'; qDiv.id = 'q-' + key;
  qDiv.innerHTML = `
    <div class="q-head"><div class="q-num">${id})</div><div class="q-text">${textHtml}</div></div>
    <div class="q-controls">
      <button type="button" class="sign-toggle plus">+</button>
      <input type="text" inputmode="decimal" class="plain-input" placeholder="ответ">
      <button type="button" class="comma-btn">,</button>
      <button class="check">Проверить</button>
      <span class="feedback"></span>
    </div>`;
  content.appendChild(qDiv);
  attempts[key] = 0; total++;
  const signBtn = qDiv.querySelector('.sign-toggle');
  const input = qDiv.querySelector('.plain-input');
  const commaBtn = qDiv.querySelector('.comma-btn');
  const btn = qDiv.querySelector('button.check'), fb = qDiv.querySelector('.feedback');
  signBtn.addEventListener('click', () => {
    signState[key] = -signState[key];
    if (signState[key]===-1){signBtn.textContent=MINUS;signBtn.classList.remove('plus');}
    else {signBtn.textContent='+';signBtn.classList.add('plus');}
  });
  commaBtn.addEventListener('click', () => { if(!input.value.includes(',')){input.value+=',';input.focus();} });
  btn.addEventListener('click', () => {
    const raw = input.value.trim();
    if (raw==='') { fb.className='feedback hint'; fb.textContent='введи число'; return; }
    const val = signState[key]*parseFloat(raw.replace(',','.'));
    if (isNaN(val)) { fb.className='feedback hint'; fb.textContent='введи число'; return; }
    attempts[key]++;
    if (Math.abs(val-answer) < 0.0001) markCorrect(qDiv, fb, key); else markWrong(qDiv, fb, key);
  });
}

function group(title) {
  const h = document.createElement('div'); h.className='group-title'; h.textContent=title; content.appendChild(h);
}

group('Задание 1 — вычисли');
TASK1.forEach(([id,txt,ans]) => renderDecAnswer(id, txt + ' =', ans, 't1-'));

group('№14 ЕГЭ — действия с дробями');
EGE14.forEach(([id,txt,ans]) => renderDecAnswer(id, txt, ans, 'ege-'));

group('ЕГЭ №5 — теория вероятностей');
PROB.forEach(([id,txt,ans]) => renderDecAnswer(id, txt, ans, 'p5-'));

document.getElementById('totalCount').textContent = total;
</script>
</body>
</html>
