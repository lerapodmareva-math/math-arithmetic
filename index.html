<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модуль 1 — Тренажёр</title>
<style>
  :root{
    --beige:#F5EEDF;
    --gray:#ECECEC;
    --gray-txt:#6b6b6b;
    --green:#4CAF50;
    --green-bg:#E9F5EA;
    --red:#D64545;
    --red-bg:#FBEAEA;
    --blue:#2E5E8C;
    --ink:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray);
    color: var(--ink);
    padding: 24px 12px 60px;
  }
  .wrap{max-width:720px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:18px;
  }
  header h1{
    color:var(--blue);
    font-size:28px;
    margin:0 0 4px;
  }
  header p{
    margin:0;
    color:#555;
    font-style:italic;
  }
  .nick{
    text-align:right;
    color:var(--gray-txt);
    font-weight:600;
    font-size:14px;
    margin-bottom:8px;
  }
  .progress-card{
    background:white;
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
    border:1px solid #ddd;
    position:sticky;
    top:10px;
    z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .progress-stats{
    font-size:15px;
    line-height:1.5;
  }
  .progress-stats b{color:var(--blue);}
  .bar-outer{
    flex:1;
    height:10px;
    background:var(--gray);
    border-radius:6px;
    overflow:hidden;
    margin:0 14px;
  }
  .bar-inner{
    height:100%;
    background:var(--green);
    width:0%;
    transition:width .3s ease;
  }
  button.reset{
    background:white;
    border:1px solid #ccc;
    color:#666;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.reset:hover{background:#f5f5f5;}

  .block-title{
    background:var(--gray);
    border-left:6px solid var(--blue);
    color:var(--blue);
    font-weight:700;
    font-size:18px;
    padding:10px 14px;
    border-radius:4px;
    margin:26px 0 12px;
  }
  .sub-label{
    font-weight:700;
    margin:16px 0 8px;
    font-size:15px;
  }

  .q{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    transition: background .2s, border-color .2s;
  }
  .q.correct{background:var(--green-bg); border-color:var(--green);}
  .q.wrong{background:var(--red-bg); border-color:var(--red);}

  .q-num{
    font-weight:700;
    color:var(--blue);
    min-width:26px;
  }
  .q-expr{
    font-size:17px;
    flex:1;
    min-width:140px;
  }
  .q input{
    width:100px;
    padding:7px 8px;
    font-size:16px;
    border:1px solid #bbb;
    border-radius:8px;
    text-align:center;
  }
  .q input:focus{outline:2px solid var(--blue); border-color:var(--blue);}
  .q button.check{
    background:var(--blue);
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
  }
  .q button.check:hover{background:#244a70;}
  .feedback{
    font-size:14px;
    font-weight:600;
    min-width:90px;
  }
  .feedback.ok{color:var(--green);}
  .feedback.bad{color:var(--red);}
  .feedback.hint{color:var(--gray-txt); font-weight:400; font-style:italic;}
  .reveal-btn{
    background:none;
    border:none;
    color:var(--red);
    text-decoration:underline;
    cursor:pointer;
    font-size:13px;
    padding:0;
  }

  .footer-note{
    text-align:center;
    color:var(--gray-txt);
    font-size:13px;
    margin-top:30px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nick">@lerapodmareva</div>
  <header>
    <h1>Модуль 1</h1>
    <p>Умножение и деление рациональных чисел — тренажёр</p>
  </header>

  <div class="progress-card">
    <div class="progress-stats">Решено: <b id="doneCount">0</b> / <span id="totalCount">0</span> &nbsp;·&nbsp; Верно: <b id="correctCount">0</b></div>
    <div class="bar-outer"><div class="bar-inner" id="bar"></div></div>
    <button class="reset" onclick="resetAll()">Сбросить всё</button>
  </div>

  <div id="content"></div>

  <div class="footer-note">Отвечай без пробелов, минус пиши обычным дефисом: например -12</div>
</div>

<script>
const DATA = [
  { block: 1, title: "Блок 1. Правило знаков", sub: "Реши:", items: [
    ["(–6) × (–7)", 42],
    ["9 × (–4)", -36],
    ["(–48) : 8", -6],
    ["(–5) × (–9)", 45],
    ["63 : (–7)", -9],
    ["(–12) × (–1)", 12],
    ["(–36) : (–4)", 9],
    ["15 × (–3)", -45],
    ["(–100) : (–25)", 4],
    ["(–7) × 8", -56],
  ]},
  { block: 1, sub: "Посложнее — считаем в столбик:", items: [
    ["(–236) × 47", -11092],
    ["(–305) × (–24)", 7320],
    ["(–4576) : 8", -572],
    ["(–3216) : 4", -804],
    ["(–17) × 0", 0],
    ["0 : (–9)", 0],
  ]},
  { block: 2, title: "Блок 2. Несколько минусов подряд", sub: "Посчитай знак и найди значение:", items: [
    ["–(–(–6))", -6],
    ["–(–(–(–3)))", 3],
    ["–(–(–(–(–10))))", -10],
    ["–(–4)", 4],
  ]},
];

let total = 0;
let solved = {};   // key -> true once solved correctly
let attempts = {}; // key -> number of wrong attempts

const content = document.getElementById('content');
let qid = 0;

DATA.forEach(section => {
  if (section.title) {
    const h = document.createElement('div');
    h.className = 'block-title';
    h.textContent = section.title;
    content.appendChild(h);
  }
  if (section.sub) {
    const s = document.createElement('div');
    s.className = 'sub-label';
    s.textContent = section.sub;
    content.appendChild(s);
  }
  section.items.forEach(([expr, answer]) => {
    qid++;
    total++;
    const id = 'q' + qid;
    const row = document.createElement('div');
    row.className = 'q';
    row.id = id;
    row.innerHTML = `
      <div class="q-num">${qid})</div>
      <div class="q-expr">${expr}</div>
      <input type="text" inputmode="numeric" placeholder="ответ" id="${id}-input">
      <button class="check" onclick="checkAnswer('${id}', ${answer})">Проверить</button>
      <div class="feedback" id="${id}-fb"></div>
    `;
    content.appendChild(row);
  });
});

document.getElementById('totalCount').textContent = total;

function normalize(str) {
  return str.trim().replace(/–|—/g, '-').replace(',', '.');
}

function checkAnswer(id, answer) {
  const inputEl = document.getElementById(id + '-input');
  const fb = document.getElementById(id + '-fb');
  const row = document.getElementById(id);
  const raw = normalize(inputEl.value);
  const val = parseFloat(raw);

  if (raw === '' || isNaN(val)) {
    fb.className = 'feedback hint';
    fb.textContent = 'введи число';
    return;
  }

  if (val === answer) {
    row.className = 'q correct';
    fb.className = 'feedback ok';
    fb.textContent = '✓ верно!';
    inputEl.disabled = true;
    if (!solved[id]) {
      solved[id] = true;
      updateProgress();
    }
  } else {
    row.className = 'q wrong';
    attempts[id] = (attempts[id] || 0) + 1;
    if (attempts[id] >= 2) {
      fb.className = 'feedback bad';
      fb.innerHTML = `не то. <button class="reveal-btn" onclick="reveal('${id}', ${answer})">показать ответ</button>`;
    } else {
      fb.className = 'feedback bad';
      fb.textContent = '✗ попробуй ещё';
    }
  }
}

function reveal(id, answer) {
  const inputEl = document.getElementById(id + '-input');
  const fb = document.getElementById(id + '-fb');
  const row = document.getElementById(id);
  inputEl.value = answer;
  inputEl.disabled = true;
  row.className = 'q wrong';
  fb.className = 'feedback bad';
  fb.textContent = 'ответ: ' + answer;
  if (!solved[id]) {
    solved[id] = 'revealed';
    updateProgress();
  }
}

function updateProgress() {
  const doneKeys = Object.keys(solved);
  const doneCount = doneKeys.length;
  const correctCount = doneKeys.filter(k => solved[k] === true).length;
  document.getElementById('doneCount').textContent = doneCount;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('bar').style.width = (doneCount / total * 100) + '%';
}

function resetAll() {
  solved = {};
  attempts = {};
  document.querySelectorAll('.q').forEach(row => {
    row.className = 'q';
    const input = row.querySelector('input');
    input.value = '';
    input.disabled = false;
    row.querySelector('.feedback').textContent = '';
  });
  updateProgress();
}

// allow Enter key to trigger check
content.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
    const btn = e.target.parentElement.querySelector('button.check');
    if (btn) btn.click();
  }
});
</script>
</body>
</html>
