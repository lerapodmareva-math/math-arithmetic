<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бланк ответов — Вариант №09</title>
<style>
  :root{
    --beige:#F5EEDF;
    --gray:#ECECEC;
    --gray-txt:#6b6b6b;
    --green:#4CAF50;
    --green-bg:#E9F5EA;
    --red:#D64545;
    --red-bg:#FBEAEA;
    --blue:#2E5E8C;
    --ink:#2a2a2a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--gray);
    color: var(--ink);
    padding: 24px 12px 80px;
  }
  .wrap{max-width:640px;margin:0 auto;}
  .nick{text-align:right;color:var(--gray-txt);font-weight:600;font-size:14px;margin-bottom:8px;}
  header{text-align:center;margin-bottom:20px;}
  header h1{color:var(--blue);font-size:26px;margin:0 0 4px;}
  header p{margin:0;color:#555;font-style:italic;font-size:15px;}

  .q{
    background:white;border:1px solid #ddd;border-radius:12px;padding:12px 16px;
    margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    transition: background .2s, border-color .2s;
  }
  .q.correct{background:var(--green-bg); border-color:var(--green);}
  .q.wrong{background:var(--red-bg); border-color:var(--red);}
  .q-num{font-weight:700;color:var(--blue);min-width:90px;}

  .sign-toggle{
    width:36px;height:36px;border-radius:8px;border:1px solid #bbb;background:#f5f5f5;
    font-size:18px;font-weight:700;cursor:pointer;color:var(--red);flex-shrink:0;
  }
  .sign-toggle.plus{color:var(--green);}
  .comma-btn{
    width:36px;height:36px;border-radius:8px;border:1px solid #bbb;background:#f5f5f5;
    font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0;
  }
  .q input{
    flex:1;min-width:90px;max-width:220px;padding:8px 10px;font-size:17px;
    border:1px solid #bbb;border-radius:8px;text-align:center;
  }
  .q input:focus{outline:2px solid var(--blue); border-color:var(--blue);}

  .check-bar{
    position:sticky;bottom:14px;display:flex;justify-content:center;margin-top:26px;
  }
  .check-bar button{
    background:var(--blue);color:white;border:none;padding:14px 30px;border-radius:12px;
    font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .check-bar button:hover{background:#244a70;}

  .result-card{
    display:none;background:white;border:2px solid var(--blue);border-radius:14px;
    padding:20px;margin-top:24px;text-align:center;
  }
  .result-card.show{display:block;}
  .result-score{font-size:32px;font-weight:800;color:var(--blue);margin-bottom:6px;}
  .result-grade{font-size:20px;font-weight:700;margin-bottom:14px;}
  .grade-2{color:var(--red);}
  .grade-3{color:#C98A2C;}
  .grade-4{color:#3A7DBF;}
  .grade-5{color:var(--green);}
  .result-note{
    background:var(--beige);border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;color:#8A6100;
  }

  .results{display:none;margin-top:20px;background:white;border:1px solid #ddd;border-radius:14px;padding:16px 18px;}
  .results.show{display:block;}
  .results h2{color:var(--blue);font-size:16px;margin:0 0 12px;text-align:center;}
  .results-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cell{border-radius:8px;padding:8px 4px;text-align:center;font-weight:700;font-size:14px;border:1px solid #ddd;background:#f7f7f7;color:#999;}
  .cell .n{display:block;font-size:11px;font-weight:600;color:#888;margin-bottom:2px;}
  .cell.plus{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .cell.minus{background:var(--red-bg);border-color:var(--red);color:var(--red);}

  .footer-note{text-align:center;color:var(--gray-txt);font-size:13px;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="nick">@lerapodmareva</div>
  <header>
    <h1>Бланк ответов</h1>
    <p>ЕГЭбаз 2026 · Тренировочный вариант №09</p>
  </header>

  <div id="content"></div>

  <div class="check-bar">
    <button id="checkAllBtn">Проверить весь вариант</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-score" id="resultScore"></div>
    <div class="result-grade" id="resultGrade"></div>
    <div class="result-note">Сделай скрин и скинь мне в Телеграм</div>
  </div>

  <div class="results" id="resultsBlock">
    <h2>Итоги по заданиям</h2>
    <div class="results-grid" id="resultsGrid"></div>
  </div>

  <div class="footer-note">Кнопка «+/−» меняет знак. Кнопка «,» ставит запятую для десятичного ответа.</div>
</div>

<script>
// [номер, тип, ответ]
// тип: "num" — число (может быть отрицательным/десятичным), "multi" — засчитывается любой из перечисленных вариантов
const ANSWERS = [
  [1, "num", 1925],
  [2, "num", 2341],
  [3, "num", 11049],
  [4, "num", 48],
  [5, "num", 0.55],
  [6, "num", 5124],
  [7, "num", 1432],
  [8, "num", 14],
  [9, "num", 24],
  [10, "num", 120],
  [11, "num", 375],
  [12, "num", 12],
  [13, "num", 80],
  [14, "num", -16.8],
  [15, "num", 2574],
  [16, "num", 64],
  [17, "num", 24],
  [18, "num", 4321],
  [19, "multi", [1395, 1485, 1575, 1665]],
  [20, "num", 72],
  [21, "num", 414],
];

const content = document.getElementById('content');
const signState = {};

function insertComma(id) {
  const inp = document.getElementById('input-' + id);
  if (!inp.value.includes(',')) {
    inp.value += ',';
    inp.focus();
  }
}

ANSWERS.forEach(([num, type]) => {
  const qDiv = document.createElement('div');
  qDiv.className = 'q';
  qDiv.id = 'q-' + num;

  signState[num] = 1;
  const controls = `
    <button type="button" class="sign-toggle plus" data-id="${num}">+</button>
    <input type="text" inputmode="decimal" id="input-${num}" placeholder="ответ">
    <button type="button" class="comma-btn" data-id="${num}">,</button>
  `;

  qDiv.innerHTML = `<div class="q-num">Задание ${num}</div>${controls}`;
  content.appendChild(qDiv);

  const cell = document.createElement('div');
  cell.className = 'cell'; cell.id = 'cell-' + num;
  cell.innerHTML = `<span class="n">${num}</span><span class="mark">·</span>`;
  document.getElementById('resultsGrid').appendChild(cell);
});

content.addEventListener('click', (e) => {
  if (e.target.matches('.sign-toggle')) {
    const id = e.target.getAttribute('data-id');
    signState[id] = -signState[id];
    if (signState[id] === -1) { e.target.textContent = '\u2212'; e.target.classList.remove('plus'); }
    else { e.target.textContent = '+'; e.target.classList.add('plus'); }
  }
  if (e.target.matches('.comma-btn')) {
    insertComma(e.target.getAttribute('data-id'));
  }
});

document.getElementById('checkAllBtn').addEventListener('click', () => {
  let score = 0;
  ANSWERS.forEach(([num, type, answer]) => {
    const qDiv = document.getElementById('q-' + num);
    const inputEl = document.getElementById('input-' + num);
    const raw = inputEl.value.trim();
    let correct = false;

    if (type === 'num') {
      if (raw !== '') {
        const val = parseFloat(raw.replace(',', '.')) * signState[num];
        if (!isNaN(val) && Math.abs(val - answer) < 0.0001) correct = true;
      }
    } else if (type === 'multi') {
      if (raw !== '') {
        const val = parseFloat(raw.replace(',', '.')) * signState[num];
        if (!isNaN(val)) correct = answer.some(a => Math.abs(val - a) < 0.0001);
      }
    }

    qDiv.classList.remove('correct', 'wrong');
    qDiv.classList.add(correct ? 'correct' : 'wrong');
    if (correct) score++;

    const cell = document.getElementById('cell-' + num);
    cell.classList.remove('plus', 'minus');
    cell.classList.add(correct ? 'plus' : 'minus');
    cell.querySelector('.mark').textContent = correct ? '+' : '−';
  });

  let grade, gradeClass;
  if (score <= 6) { grade = 2; gradeClass = 'grade-2'; }
  else if (score <= 11) { grade = 3; gradeClass = 'grade-3'; }
  else if (score <= 16) { grade = 4; gradeClass = 'grade-4'; }
  else { grade = 5; gradeClass = 'grade-5'; }

  document.getElementById('resultScore').textContent = `${score} из 21`;
  const gEl = document.getElementById('resultGrade');
  gEl.textContent = `Оценка: ${grade}`;
  gEl.className = 'result-grade ' + gradeClass;
  document.getElementById('resultCard').classList.add('show');
  document.getElementById('resultsBlock').classList.add('show');
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
});
</script>
</body>
</html>
